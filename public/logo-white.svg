<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-main { font-family: 'Arial', sans-serif; font-weight: 900; font-size: 80px; fill: #FFFFFF; }
      .text-tagline { font-family: 'Arial', sans-serif; font-weight: normal; font-size: 24px; letter-spacing: 12px; fill: #FFFFFF; }
      .icon-fill { fill: #FFFFFF; }
    </style>
  </defs>

  <g transform="translate(250, 40)">
    <!-- Custom outer frame + r stem -->
    <path class="icon-fill" d="
      M 50 180 
      L 50 60
      A 40 40 0 0 1 90 20
      L 210 20
      A 40 40 0 0 1 250 60
      L 250 160
      A 20 20 0 0 1 230 180
      L 180 180
      L 220 140
      A 5 5 0 0 0 220 135
      L 220 60
      A 10 10 0 0 0 210 50
      L 90 50
      A 10 10 0 0 0 80 60
      L 80 110
      L 50 110
      Z
    "/>
    
    <!-- r branch -->
    <path class="icon-fill" d="
      M 80 140
      A 30 30 0 0 1 110 110
      L 125 110
      L 125 140
      L 110 140
      A 10 10 0 0 0 100 150
      L 100 180
      L 80 180
      Z
    "/>
    <!-- m left stem -->
    <rect class="icon-fill" x="110" y="140" width="20" height="40" />
    
    <!-- m middle stem and curve -->
    <path class="icon-fill" d="
      M 110 140
      A 20 20 0 0 1 150 120
      A 20 20 0 0 1 190 140
      L 190 180
      L 170 180
      L 170 140
      A 10 10 0 0 0 150 140
      L 150 180
      L 130 180
      L 130 140
      A 10 10 0 0 0 110 140
      Z
    "/>
  </g>

  <!-- Revolut text -->
  <text class="text-main" x="140" y="320">Rev</text>
  <text class="text-main" x="310" y="320">lut</text>
  
  <!-- Recycle 'o' -->
  <g transform="translate(260, 260) scale(0.6)">
    <path class="icon-fill" d="
      M50 10 A40 40 0 1 1 10 50 L20 50 A30 30 0 1 0 50 20 Z
    "/>
    <polygon class="icon-fill" points="50,0 70,15 50,30" />
    <polygon class="icon-fill" points="0,50 15,70 30,50" />
  </g>

  <!-- M$ney text -->
  <text class="text-main" x="430" y="320">M</text>
  <text class="text-main" x="550" y="320">ney</text>

  <!-- '$' 'o' -->
  <g transform="translate(490, 260) scale(0.6)">
    <circle cx="50" cy="50" r="40" stroke="#FFFFFF" stroke-width="12" fill="none" />
    <text x="50" y="70" font-family="Arial" font-weight="900" font-size="55" text-anchor="middle" fill="#FFFFFF">$</text>
  </g>

  <!-- Tagline -->
  <text class="text-tagline" x="400" y="380" text-anchor="middle">Simplify your finances</text>
</svg>
