<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00773E" />

    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Default title (overridden per-page by react-helmet-async) -->
    <title>Revolut Money – Loan Advisory in Ahmedabad</title>
    <meta name="description" content="Revolut Money is an independent loan advisory in Ahmedabad. We source Home Loans, LAP, Car Loans, Business Loans and more from 17+ partner banks and NBFCs." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revolut Money" />
    <meta property="og:title" content="Revolut Money – Simplify Your Finances" />
    <meta property="og:description" content="Independent loan advisory in Ahmedabad. 17+ partner banks and NBFCs." />
    <meta property="og:image" content="/og-default.jpg" />

    <!-- Preconnect to Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts – preloaded for critical rendering -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Tailwind via Vite (injected at build) -->
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1 style="color: #00773E; margin-bottom: 8px;">Revolut Money</h1>
        <p><strong>Phone:</strong> +91 90816 45552</p>
        <p><strong>Email:</strong> info@revolutmoney.com</p>
        <p><strong>Instagram:</strong> @revolut__money</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
